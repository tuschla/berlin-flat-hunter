# Multi-profile setup. Each service is an independent search profile with its
# own config, DB, stats, and schema-monitor state — fully isolated.
#
# Layout:
#   profiles/
#     single.yaml     # solo flat, ≤€600, 1 room
#     wg.yaml         # WG/2-room flat, ≤€1100
#   data/
#     single/         # DB + stats + monitor state for "single"
#     wg/             # ditto for "wg"
#
# Each YAML sets `database_location: /data/db.sqlite` so files land in the
# per-profile volume and never collide.

services:
  single:
    build: .
    image: berlin-flat-hunter:latest
    container_name: bfh-single
    restart: unless-stopped
    volumes:
      - ./profiles/single.yaml:/config/config.yaml:ro
      - ./data/single:/data
    # Uncomment to share Ollama from host (host.docker.internal on Mac/Win,
    # 172.17.0.1 or use network_mode: host on Linux):
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  wg:
    build: .
    image: berlin-flat-hunter:latest
    container_name: bfh-wg
    restart: unless-stopped
    volumes:
      - ./profiles/wg.yaml:/config/config.yaml:ro
      - ./data/wg:/data

  # Hands-off auto-apply profile. Builds the runtime-vnc Dockerfile target
  # so Chrome runs *headed* inside Xvfb, the profile dir persists across
  # restarts (cookies/login state survives), and noVNC is reachable on
  # http://localhost:6080/vnc.html for first-time login + occasional
  # CAPTCHA solving. The /data/chrome-profile path is set via
  # BFH_CHROME_PROFILE in the runtime-vnc image; AutoApplicator picks it
  # up automatically.
  vnc:
    build:
      context: .
      target: runtime-vnc
    image: berlin-flat-hunter:vnc
    container_name: bfh-vnc
    restart: unless-stopped
    volumes:
      - ./profiles/vnc.yaml:/config/config.yaml:ro
      - ./data/vnc:/data
    ports:
      - "127.0.0.1:6080:6080"   # noVNC — bound to localhost, not the LAN
    # shm-size avoids Chrome's "Out of memory" crash on /dev/shm exhaustion
    shm_size: "2gb"
