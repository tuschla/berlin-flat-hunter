; supervisord config for the runtime-vnc Docker target.
;
; Service order matters: Xvfb must be ready before fluxbox / x11vnc / Chrome,
; and websockify must wait for x11vnc's port 5900. Supervisor doesn't model
; ordering directly, but the priority field is honoured at start-up — lower
; numbers start first.

[supervisord]
nodaemon=true
user=hunter
logfile=/data/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface.make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
priority=10
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
autorestart=true
stdout_logfile=/data/xvfb.log
stderr_logfile=/data/xvfb.log
environment=HOME="/home/hunter"

[program:fluxbox]
priority=20
command=/usr/bin/fluxbox
autorestart=true
stdout_logfile=/data/fluxbox.log
stderr_logfile=/data/fluxbox.log
environment=DISPLAY=":99",HOME="/home/hunter"
; small delay so Xvfb is guaranteed accepting connections
startsecs=2

[program:x11vnc]
priority=30
; -nopw is fine because port 5900 stays inside the container (only 6080 is
; published). If you ever expose 5900, add -passwd <SECRET> here.
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -nopw -bg -o /data/x11vnc.log
; x11vnc's own -bg backgrounds the daemon; supervisor wraps it as a one-shot
autorestart=true
startsecs=0
stdout_logfile=/data/x11vnc.log
stderr_logfile=/data/x11vnc.log
environment=DISPLAY=":99",HOME="/home/hunter"

[program:novnc]
priority=40
; websockify in proxy mode: serve novnc static files at /, forward WebSocket
; frames at the same port to localhost:5900 (raw VNC).
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
startsecs=2
stdout_logfile=/data/novnc.log
stderr_logfile=/data/novnc.log

[program:bfh]
priority=50
; Wait briefly for Xvfb to be ready before Chrome (via undetected-
; chromedriver) connects. main.py honours BFH_CHROME_PROFILE through
; AutoApplicator's profile_dir resolution.
command=/app/.venv/bin/python /app/main.py --config /config/config.yaml
autorestart=true
startsecs=5
stdout_logfile=/data/bfh.log
stderr_logfile=/data/bfh.log
environment=DISPLAY=":99",HOME="/home/hunter",PATH="/app/.venv/bin:/usr/bin:/bin"
