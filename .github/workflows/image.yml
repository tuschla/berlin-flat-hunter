name: image

on:
  push:
    branches: [main]
    # The image doesn't change when only these change. Rest of deploy/ (crontab,
    # entrypoint.sh, run-job.sh) is copied into the image, so it still triggers.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - 'deploy/truenas-app.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same uv and Python as the Dockerfile; the tests need no secrets.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.13"

      - name: Tests
        run: uv run --frozen pytest -q

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/tuschla/berlin-flat-hunter
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      # Build into the local daemon first and smoke-test before anything is pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: smoke
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh smoke -c '
            set -e
            test "$(id -u)" = 568
            test -L /app/data
            supercronic -test /app/deploy/crontab
            python -c "import berlin_flat_hunter"
            python scripts/crawler_watchdog.py --dry-run
            python scripts/migrate_degewo_ids.py --help >/dev/null
            chromium --version
          '

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
